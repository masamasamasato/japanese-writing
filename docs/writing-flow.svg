<svg width="680" viewBox="0 0 680 460" role="img" xmlns="http://www.w3.org/2000/svg">
<title>綺麗な日本語を書く手順</title>
<desc>読み手を決める、骨組みを作る、結論から並べる、一文一義で書く、削って揃える、の5段階を上から下へ並べたフロー図。前半3段が構成、後半2段が文の推敲。</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .box { fill: #E1F5EE; stroke: #1D9E75; }
  .box-t { fill: #0F6E56; }
  .br { fill: #F1EFE8; stroke: #B4B2A9; }
  .br-t { fill: #5F5E5A; }
  .arr { stroke: #888780; stroke-width: 1.5; }
  @media (prefers-color-scheme: dark) {
    .box { fill: #0F6E56; stroke: #5DCAA5; }
    .box-t { fill: #E1F5EE; }
    .br { fill: #2C2C2A; stroke: #5F5E5A; }
    .br-t { fill: #D3D1C7; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect class="br" x="70" y="24" width="90" height="254" rx="8" stroke-width="0.5"/>
<text class="ts br-t" x="115" y="151" text-anchor="middle" dominant-baseline="central">構成</text>
<rect class="br" x="70" y="288" width="90" height="142" rx="8" stroke-width="0.5"/>
<text class="ts br-t" x="115" y="359" text-anchor="middle" dominant-baseline="central">文の推敲</text>

<rect class="box" x="200" y="24" width="410" height="54" rx="8" stroke-width="0.5"/>
<text class="th box-t" x="405" y="45" text-anchor="middle" dominant-baseline="central">1. 読み手を決める</text>
<text class="ts box-t" x="405" y="63" text-anchor="middle" dominant-baseline="central">誰が何のために読むか</text>

<line class="arr" x1="405" y1="80" x2="405" y2="110" marker-end="url(#arrow)"/>

<rect class="box" x="200" y="112" width="410" height="54" rx="8" stroke-width="0.5"/>
<text class="th box-t" x="405" y="133" text-anchor="middle" dominant-baseline="central">2. 骨組みを作る</text>
<text class="ts box-t" x="405" y="151" text-anchor="middle" dominant-baseline="central">段落ごとに要点を一文</text>

<line class="arr" x1="405" y1="168" x2="405" y2="198" marker-end="url(#arrow)"/>

<rect class="box" x="200" y="200" width="410" height="54" rx="8" stroke-width="0.5"/>
<text class="th box-t" x="405" y="221" text-anchor="middle" dominant-baseline="central">3. 並べる</text>
<text class="ts box-t" x="405" y="239" text-anchor="middle" dominant-baseline="central">結論 → 理由 → 詳細 → 補足</text>

<line class="arr" x1="405" y1="256" x2="405" y2="286" marker-end="url(#arrow)"/>

<rect class="box" x="200" y="288" width="410" height="54" rx="8" stroke-width="0.5"/>
<text class="th box-t" x="405" y="309" text-anchor="middle" dominant-baseline="central">4. 一文一義で書く</text>
<text class="ts box-t" x="405" y="327" text-anchor="middle" dominant-baseline="central">一文60字前後・主語と述語を近く</text>

<line class="arr" x1="405" y1="344" x2="405" y2="374" marker-end="url(#arrow)"/>

<rect class="box" x="200" y="376" width="410" height="54" rx="8" stroke-width="0.5"/>
<text class="th box-t" x="405" y="397" text-anchor="middle" dominant-baseline="central">5. 削って揃える</text>
<text class="ts box-t" x="405" y="415" text-anchor="middle" dominant-baseline="central">二〜三割削る・文体と表記を統一</text>
</svg>
