name: PR body check

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-body-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Run check.py on the PR body
        id: check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > pr-body.md
          if [ ! -s pr-body.md ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "empty=false" >> "$GITHUB_OUTPUT"
          out="$(python3 scripts/check.py pr-body.md)"
          {
            echo 'result<<EOF_CHECK_RESULT'
            echo "$out"
            echo 'EOF_CHECK_RESULT'
          } >> "$GITHUB_OUTPUT"
          {
            echo '## PR 本文チェック'
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # fork からの PR は GITHUB_TOKEN が read-only でコメントできないため、
      # コメント投稿は同一リポジトリの PR に限る。結果はジョブサマリーで見られる。
      - name: Upsert PR comment
        if: steps.check.outputs.empty == 'false' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.check.outputs.result }}
        with:
          script: |
            const PASS_SCORE = 85;
            const marker = '<!-- pr-body-check -->';
            const result = process.env.RESULT.trimEnd();
            const m = result.match(/点数:\s*(\d+)\s*\/\s*100/);
            const score = m ? parseInt(m[1], 10) : 0;
            const status = score >= PASS_SCORE ? '✅ pass' : '❌ fail';
            const body = [
              marker,
              `## PR 本文チェック ${status}`,
              '',
              '```',
              result,
              '```',
              '',
              `_\`scripts/check.py\` による自動チェック。${PASS_SCORE} 点以上で pass。点数は目安で、構成の良し悪しは測れません。_`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
